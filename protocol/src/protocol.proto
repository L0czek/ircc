syntax = "proto2";

// =============================================================================
// Response Status Codes (for minimal string operations on STM32)
// =============================================================================
enum ResponseStatusCode {
    RESPONSE_STATUS_SUCCESS = 0;
    RESPONSE_STATUS_FAILURE = 1;
    RESPONSE_STATUS_NOT_FOUND = 2;
    RESPONSE_STATUS_ALREADY_EXISTS = 3;
    RESPONSE_STATUS_INVALID_STATE = 4;
    RESPONSE_STATUS_INVALID_PARAMETERS = 5;
    RESPONSE_STATUS_TIMEOUT = 6;
    RESPONSE_STATUS_NO_MEMORY = 7;
    RESPONSE_STATUS_NO_PERMISSION = 8;
    RESPONSE_STATUS_UNSUPPORTED_COMMAND = 9;
}

// =============================================================================
// Basic Commands
// =============================================================================
message Ping {}
message Pong {}

// =============================================================================
// Charger Status Enums
// =============================================================================
enum ChargeStatus {
    CHARGE_STATUS_NOT_CHARGING = 0;
    CHARGE_STATUS_TRICKLE_CHARGE = 1;
    CHARGE_STATUS_PRECHARGE = 2;
    CHARGE_STATUS_FAST_CHARGE = 3;
    CHARGE_STATUS_TAPER_CHARGE = 4;
    CHARGE_STATUS_TOP_OFF = 6;
    CHARGE_STATUS_CHARGE_DONE = 7;
}

enum VBUSStatus {
    VBUS_STATUS_NO_INPUT = 0;
    VBUS_STATUS_USB_SDP_500MA = 1;
    VBUS_STATUS_USB_CDP_1500MA = 2;
    VBUS_STATUS_USB_DCP_3250MA = 3;
    VBUS_STATUS_ADJUSTABLE_HIGH = 4;
    VBUS_STATUS_UNKNOWN_ADAPTER = 5;
    VBUS_STATUS_NON_STANDARD_ADAPTER = 6;
    VBUS_STATUS_OTG_MODE = 7;
    VBUS_STATUS_NOT_QUALIFIED_ADAPTER = 8;
    VBUS_STATUS_POWERED_FROM_VBUS = 11;
}

enum ChargerInputSource {
    CHARGER_INPUT_USB_DPDM = 0;
    CHARGER_INPUT_AC1 = 1;
    CHARGER_INPUT_AC2 = 2;
    CHARGER_INPUT_AUTO = 3;
}

// =============================================================================
// Legacy Charger Messages (kept for backward compatibility with controller code)
// =============================================================================
message ChargerStatus {
    required bool enabled = 1;
    required bool plugged_in = 2;
    required ChargeStatus charge_status = 3;
    required VBUSStatus vbus_status = 4;
    required bool battery_present = 5;
    required bool fault_present = 6;
    required ChargerInputSource input_source = 7;
    required uint32 timestamp_ms = 8;
}

message ChargerMeasurements {
    required float vbat_voltage = 1;
    required float ibus_current = 2;
    required float vbus_voltage = 3;
    required float vsys_voltage = 4;
}

message ChargerConfig {
    required float charge_voltage_limit = 1;
    required float charge_current_limit = 2;
    required float input_voltage_limit = 3;
    required float input_current_limit = 4;
}

// =============================================================================
// DAC Status Enums
// =============================================================================
enum DACMode {
    DAC_MODE_VOLTAGE = 0;
    DAC_MODE_WAVEFORM = 1;
}

enum WaveformType {
    WAVEFORM_SINE = 0;
    WAVEFORM_SQUARE = 1;
    WAVEFORM_TRIANGLE = 2;
    WAVEFORM_SAWTOOTH = 3;
    WAVEFORM_CUSTOM = 4;
}

// =============================================================================
// DAC Legacy Messages (kept for backward compatibility with controller code)
// =============================================================================
message DACStatus {
    required bool enabled = 1;
    required DACMode mode = 2;
    required WaveformType waveform_type = 3;
    required float frequency = 4;
    required float amplitude = 5;
    required bool error = 6;
    required bool waveform_error = 7;
    required uint32 timestamp_ms = 8;
}

message DACMeasurements {
    required float voltage_output = 1;
}

message DACState {
    required float voltage = 1;
    required WaveformType waveform_type = 2;
    required float frequency = 3;
    required float amplitude = 4;
}

// =============================================================================
// Output Regulator (TPS55289) Status Enums
// =============================================================================
enum OutputRegulatorOperatingMode {
    OUTPUT_REGULATOR_OPERATING_MODE_BUCK = 0;
    OUTPUT_REGULATOR_OPERATING_MODE_BOOST = 1;
    OUTPUT_REGULATOR_OPERATING_MODE_BUCK_BOOST = 2;
    OUTPUT_REGULATOR_OPERATING_MODE_FREQUENCY_LIMIT = 3;
}

enum OutputRegulatorFeedbackMode {
    OUTPUT_REGULATOR_FEEDBACK_MODE_PWM = 0;
    OUTPUT_REGULATOR_FEEDBACK_MODE_PFM = 1;
}

// =============================================================================
// Output Regulator Legacy Messages (kept for backward compatibility with controller code)
// =============================================================================
message OutputRegulatorStatus {
    required bool enabled = 1;
    required bool fault_present = 2;
    required bool scp_fault = 3;
    required bool ocp_fault = 4;
    required bool ovp_fault = 5;
    required OutputRegulatorOperatingMode operating_mode = 6;
    required OutputRegulatorFeedbackMode feedback_mode = 7;
    required uint32 timestamp_ms = 8;
}

message OutputRegulatorMeasurements {
    required float output_voltage = 1;
    required float output_current = 2;
}

message OutputRegulatorConfig {
    optional float output_voltage = 1;
    optional float output_current_limit = 2;
    optional float sense_resistor_ohms = 3;
}

// =============================================================================
// System Status (ALL hardware status in a single message)
// Uses embedded optional messages for cleaner structure
// =============================================================================
message SystemStatus {
    // Hardware status messages (optional - only present when hardware is initialized)
    optional ChargerStatus charger = 1;
    optional OutputRegulatorStatus output_regulator = 2;
    optional DACStatus dac = 3;

    // Measurements (optional - only present when available)
    optional ChargerMeasurements charger_measurements = 4;
    optional OutputRegulatorMeasurements output_regulator_measurements = 5;
    optional DACMeasurements dac_measurements = 6;

    // State (optional - current configuration)
    optional DACState dac_state = 7;

    // Config (optional - target configuration values)
    optional ChargerConfig charger_config = 8;
    optional OutputRegulatorConfig output_regulator_config = 9;
}

// =============================================================================
// Request Commands
// =============================================================================
message GetSystemStatus {}

message ChargerConfigRequest {
    optional float charge_voltage_limit = 1;
    optional float charge_current_limit = 2;
    optional float input_voltage_limit = 3;
    optional float input_current_limit = 4;
    optional ChargerInputSource input_source = 5;
}

message OutputRegulatorConfigRequest {
    required float output_voltage = 1;
    required float output_current_limit = 2;
    required float sense_resistor_ohms = 3;
}

message DACConfigRequest {
    optional DACMode mode = 1;
    optional float voltage = 2;
    optional WaveformType waveform_type = 3;
    optional float frequency = 4;
    optional float amplitude = 5;
}

// =============================================================================
// Request Commands
// =============================================================================
message Request {
  oneof command {
    Ping ping = 1;

    // System status
    GetSystemStatus get_system_status = 2;

    // Charger commands
    ChargerConfigRequest set_charger_config = 3;

    // Output Regulator (TPS55289) commands
    OutputRegulatorConfigRequest set_output_regulator_config = 4;

    // DAC commands
    DACConfigRequest set_dac_config = 5;

    // Applet lifecycle commands (handled by controller)
    AppletStart applet_start = 6;
    AppletStop applet_stop = 7;

    // Applet command (sent to applet's on_message)
    AppletCommand applet_command = 8;

    // Applet list command (triggers applet_list_response)
    AppletList applet_list = 9;
  }
}

// =============================================================================
// Response Payloads
// =============================================================================
message Response {
  oneof payload {
    Pong pong = 1;

    // System status (all hardware in one message)
    SystemStatus system_status = 2;

    // Applet responses
    AppletStatus applet_status = 5;
    AppletListResponse applet_list_response = 6;
  }
}

// =============================================================================
// Applet Lifecycle Commands (handled by controller, not applet)
// =============================================================================
message AppletStart {
    required string applet_name = 1;
    repeated string args = 2;         // Arguments passed to configure()
}

message AppletStop {
    required string applet_name = 1;
}

// =============================================================================
// Applet Command (sent to applet's on_message for configuration)
// =============================================================================
message AppletCommand {
    required string applet_name = 1;
    repeated string args = 2;
}

// =============================================================================
// Applet Status Response (with enum status code)
// =============================================================================
message AppletStatus {
    required bool exists = 1;
    required bool running = 2;
    required ResponseStatusCode status_code = 3;  // Enum status code instead of text
    required string text = 4;                       // Text field for detailed info (optional but kept for compatibility)
}

// =============================================================================
// Applet List Response (with enum status code)
// =============================================================================
message AppletListResponse {
    repeated string applet_names = 1;
    required ResponseStatusCode status_code = 2;  // Enum status code
    required string text = 3;                       // Text field for detailed info
}

// =============================================================================
// Applet List (request message - empty, just triggers the response)
// =============================================================================
message AppletList {
}
