syntax = "proto2";

// =============================================================================
// Response Status Codes (for minimal string operations on STM32)
// =============================================================================
enum ResponseStatusCode {
    RESPONSE_STATUS_SUCCESS = 0;
    RESPONSE_STATUS_FAILURE = 1;
    RESPONSE_STATUS_NOT_FOUND = 2;
    RESPONSE_STATUS_ALREADY_EXISTS = 3;
    RESPONSE_STATUS_INVALID_STATE = 4;
    RESPONSE_STATUS_INVALID_PARAMETERS = 5;
    RESPONSE_STATUS_TIMEOUT = 6;
    RESPONSE_STATUS_NO_MEMORY = 7;
    RESPONSE_STATUS_NO_PERMISSION = 8;
    RESPONSE_STATUS_UNSUPPORTED_COMMAND = 9;
}

// =============================================================================
// Basic Commands
// =============================================================================
message Ping {}
message Pong {}

// =============================================================================
// Charger Status Enums
// =============================================================================
enum ChargeStatus {
    CHARGE_STATUS_NOT_CHARGING = 0;
    CHARGE_STATUS_TRICKLE_CHARGE = 1;
    CHARGE_STATUS_PRECHARGE = 2;
    CHARGE_STATUS_FAST_CHARGE = 3;
    CHARGE_STATUS_TAPER_CHARGE = 4;
    CHARGE_STATUS_TOP_OFF = 6;
    CHARGE_STATUS_CHARGE_DONE = 7;
}

enum VBUSStatus {
    VBUS_STATUS_NO_INPUT = 0;
    VBUS_STATUS_USB_SDP_500MA = 1;
    VBUS_STATUS_USB_CDP_1500MA = 2;
    VBUS_STATUS_USB_DCP_3250MA = 3;
    VBUS_STATUS_ADJUSTABLE_HIGH = 4;
    VBUS_STATUS_UNKNOWN_ADAPTER = 5;
    VBUS_STATUS_NON_STANDARD_ADAPTER = 6;
    VBUS_STATUS_OTG_MODE = 7;
    VBUS_STATUS_NOT_QUALIFIED_ADAPTER = 8;
    VBUS_STATUS_POWERED_FROM_VBUS = 11;
}

enum ChargerInputSource {
    CHARGER_INPUT_USB_DPDM = 0;
    CHARGER_INPUT_AC1 = 1;
    CHARGER_INPUT_AC2 = 2;
    CHARGER_INPUT_AUTO = 3;
}

// =============================================================================
// Controller error codes - mirror of enum class ControllerError (controller/inc/error.hpp).
// Checked at compile time by static_asserts in controller/src/error.cc. Never renumber.
// =============================================================================
enum ControllerErrorCode {
    CONTROLLER_ERROR_HAL_OK = 0;
    CONTROLLER_ERROR_HAL_ERROR = 1;
    CONTROLLER_ERROR_HAL_BUSY = 2;
    CONTROLLER_ERROR_HAL_TIMEOUT = 3;
    CONTROLLER_ERROR_BQ25792_NONE = 10;
    CONTROLLER_ERROR_BQ25792_HAL_ERROR = 11;
    CONTROLLER_ERROR_BQ25792_TIMEOUT = 12;
    CONTROLLER_ERROR_BQ25792_I2C_ERROR = 13;
    CONTROLLER_ERROR_BQ25792_INVALID_ADDRESS = 14;
    CONTROLLER_ERROR_BQ25792_INVALID_PARAMETER = 15;
    CONTROLLER_ERROR_BQ25792_NOT_INITIALIZED = 16;
    CONTROLLER_ERROR_BQ25792_BATTERY_NOT_PRESENT = 17;
    CONTROLLER_ERROR_BQ25792_FAULT_DETECTED = 18;
    CONTROLLER_ERROR_TPS55289_NONE = 20;
    CONTROLLER_ERROR_TPS55289_HAL_ERROR = 21;
    CONTROLLER_ERROR_TPS55289_TIMEOUT = 22;
    CONTROLLER_ERROR_TPS55289_INVALID_ADDRESS = 23;
    CONTROLLER_ERROR_TPS55289_INVALID_REGISTER = 24;
    CONTROLLER_ERROR_TPS55289_NOT_INITIALIZED = 25;
    CONTROLLER_ERROR_TPS55289_I2C_ERROR = 26;
    CONTROLLER_ERROR_TPS55289_INVALID_PARAMETER = 27;
    CONTROLLER_ERROR_DAC_NONE = 30;
    CONTROLLER_ERROR_DAC_ERROR = 31;
    CONTROLLER_ERROR_DAC_TIMEOUT = 32;
    CONTROLLER_ERROR_DAC_INVALID_MODE = 33;
    CONTROLLER_ERROR_DAC_INVALID_PARAMETER = 34;
    CONTROLLER_ERROR_DAC_NOT_INITIALIZED = 35;
    CONTROLLER_ERROR_DAC_DMA_ERROR = 36;
    CONTROLLER_ERROR_DAC_WAVEFORM_ERROR = 37;
    CONTROLLER_ERROR_UNKNOWN_ERROR = 100;
    CONTROLLER_ERROR_OSCILLOSCOPE_NOT_CONFIGURED = 110;
    CONTROLLER_ERROR_OSCILLOSCOPE_BUFFER_OVERFLOW = 111;
    CONTROLLER_ERROR_OSCILLOSCOPE_BUFFER_EMPTY = 112;
    CONTROLLER_ERROR_OSCILLOSCOPE_OVERRUN = 113;
    CONTROLLER_ERROR_OSCILLOSCOPE_INVALID_CHANNEL = 114;
    CONTROLLER_ERROR_OSCILLOSCOPE_DMA_ERROR = 115;
    CONTROLLER_ERROR_I2C_ARBITRATION_LOST = 120;
    CONTROLLER_ERROR_I2C_NACK = 121;
    CONTROLLER_ERROR_I2C_BUS_ERROR = 122;
    CONTROLLER_ERROR_MEMORY_ALLOCATION_FAILED = 130;
    CONTROLLER_ERROR_ADC_CONVERSION_ERROR = 140;
    CONTROLLER_ERROR_ADC_BUFFER_EMPTY = 141;
    CONTROLLER_ERROR_ADC_BUFFER_OVERRUN = 142;
    CONTROLLER_ERROR_PSRAM_NONE = 150;
    CONTROLLER_ERROR_PSRAM_HAL_ERROR = 151;
    CONTROLLER_ERROR_PSRAM_TIMEOUT = 152;
    CONTROLLER_ERROR_PSRAM_INVALID_ADDRESS = 153;
    CONTROLLER_ERROR_PSRAM_INVALID_SIZE = 154;
    CONTROLLER_ERROR_PSRAM_NOT_INITIALIZED = 155;
    CONTROLLER_ERROR_PSRAM_QSPI_ERROR = 156;
    CONTROLLER_ERROR_PSRAM_CLOCK_TOO_SLOW = 157;
    CONTROLLER_ERROR_PSRAM_CLOCK_TOO_FAST = 158;
    CONTROLLER_ERROR_PSRAM_CONFIG_ERROR = 159;
    CONTROLLER_ERROR_PSRAM_NOT_SUPPORTED = 160;
