// Outcome of the command a Response answers. Present on every response to a
// command that can fail (set_*_config); status SUCCESS means it was applied.
message CommandResult {
    required ResponseStatusCode status = 1;
    optional ControllerErrorCode error = 2;   // first error encountered, if any
}

// =============================================================================
// Legacy Charger Messages (kept for backward compatibility with controller code)
// =============================================================================
message ChargerStatus {
    required bool enabled = 1;
    required bool plugged_in = 2;
    required ChargeStatus charge_status = 3;
    required VBUSStatus vbus_status = 4;
    required bool battery_present = 5;
    required bool fault_present = 6;
    required ChargerInputSource input_source = 7;
    required uint32 timestamp_ms = 8;
    // Raw BQ25792 status registers, decoded by the host:
    //   bits 0-7   REG1B: VBUS_PRESENT, AC1_PRESENT, AC2_PRESENT, PG, POORSRC, WD, VINDPM, IINDPM
    //   bits 8-15  REG1D: VBAT_PRESENT, DPDM, TREG, -, -, -, ICO[1:0]
    //   bits 16-23 REG1E: -, PRECHG_TMR, TRICHG_TMR, CHG_TMR, VSYS, ADC_DONE, ACRB1, ACRB2
    //   bits 24-31 REG1F: TS_HOT, TS_WARM, TS_COOL, TS_COLD, VBATOTG_LOW
    optional uint32 status_flags = 9;
    //   bits 0-7   REG20: VAC1_OVP, VAC2_OVP, CONV_OCP, IBAT_OCP, IBUS_OCP, VBAT_OVP, VBUS_OVP, IBAT_REG
    //   bits 8-15  REG21: -, -, TSHUT, -, OTG_UVP, OTG_OVP, VSYS_OVP, VSYS_SHORT
    optional uint32 fault_flags = 10;
}

message ChargerMeasurements {
    required float vbat_voltage = 1;
    required float ibus_current = 2;
    required float vbus_voltage = 3;
    required float vsys_voltage = 4;
    optional float ibat_current = 5;    // + = charging, - = discharging
    optional float vac1_voltage = 6;    // input 1 (USB-C)
    optional float vac2_voltage = 7;    // input 2 (dock DC)
}

// input_voltage_limit / input_current_limit are the values in use (VINDPM / IINDPM read
// back from the BQ25792). The input power policy (docs/usb_pd.md) computes them from the
// active input: the USB-C contract (VAC1) or the dock limit (VAC2), then applies the host's
// input_current_cap and input_voltage_floor.
message ChargerConfig {
    required float charge_voltage_limit = 1;
    required float charge_current_limit = 2;
    required float input_voltage_limit = 3;
    required float input_current_limit = 4;
    optional float dock_input_current_limit = 5;   // A, IINDPM while the dock (VAC2) supplies
    optional float input_current_cap = 6;          // A, host cap on any input (3.3 = none)
    optional float input_voltage_floor = 7;        // V, host minimum VINDPM (3.6 = none)
}

// =============================================================================
// DAC Status Enums
// =============================================================================
enum DACMode {
    DAC_MODE_VOLTAGE = 0;
    DAC_MODE_WAVEFORM = 1;
}

enum WaveformType {
    WAVEFORM_SINE = 0;
    WAVEFORM_SQUARE = 1;
    WAVEFORM_TRIANGLE = 2;
    WAVEFORM_SAWTOOTH = 3;
    WAVEFORM_CUSTOM = 4;
}

// =============================================================================
// DAC Legacy Messages (kept for backward compatibility with controller code)
// =============================================================================
message DACStatus {
    required bool enabled = 1;
    required DACMode mode = 2;
    required WaveformType waveform_type = 3;
    required float frequency = 4;
    required float amplitude = 5;
    required bool error = 6;
    required bool waveform_error = 7;
    required uint32 timestamp_ms = 8;
}

message DACMeasurements {
    required float voltage_output = 1;
}

message DACState {
    required float voltage = 1;
    required WaveformType waveform_type = 2;
    required float frequency = 3;
    required float amplitude = 4;
}

// =============================================================================
// Output Regulator (TPS55289) Status Enums
// =============================================================================
enum OutputRegulatorOperatingMode {
    OUTPUT_REGULATOR_OPERATING_MODE_BUCK = 0;
    OUTPUT_REGULATOR_OPERATING_MODE_BOOST = 1;
    OUTPUT_REGULATOR_OPERATING_MODE_BUCK_BOOST = 2;
    OUTPUT_REGULATOR_OPERATING_MODE_FREQUENCY_LIMIT = 3;
}

enum OutputRegulatorFeedbackMode {
    OUTPUT_REGULATOR_FEEDBACK_MODE_PWM = 0;
    OUTPUT_REGULATOR_FEEDBACK_MODE_PFM = 1;
}

// =============================================================================
// Output Regulator Legacy Messages (kept for backward compatibility with controller code)
// =============================================================================
message OutputRegulatorStatus {
    required bool enabled = 1;
    required bool fault_present = 2;
    required bool scp_fault = 3;
    required bool ocp_fault = 4;
    required bool ovp_fault = 5;
    required OutputRegulatorOperatingMode operating_mode = 6;
    required OutputRegulatorFeedbackMode feedback_mode = 7;
    required uint32 timestamp_ms = 8;
}

message OutputRegulatorMeasurements {
    required float output_voltage = 1;
    required float output_current = 2;
}

message OutputRegulatorConfig {
    optional float output_voltage = 1;
    optional float output_current_limit = 2;
    optional float sense_resistor_ohms = 3;
}

// =============================================================================
// System Status (ALL hardware status in a single message)
// Uses embedded optional messages for cleaner structure
// =============================================================================
message SystemStatus {
    // Hardware status messages (optional - only present when hardware is initialized)
    optional ChargerStatus charger = 1;
    optional OutputRegulatorStatus output_regulator = 2;
    optional DACStatus dac = 3;

    // Measurements (optional - only present when available)
    optional ChargerMeasurements charger_measurements = 4;
    optional OutputRegulatorMeasurements output_regulator_measurements = 5;
    optional DACMeasurements dac_measurements = 6;

    // State (optional - current configuration)
    optional DACState dac_state = 7;

    // Config (optional - target configuration values)
    optional ChargerConfig charger_config = 8;
    optional OutputRegulatorConfig output_regulator_config = 9;

    // USB-C port (absent on boards without UCPD)
    optional UsbPdStatus usb_pd = 10;
    optional UsbPdConfig usb_pd_config = 11;
}

// =============================================================================
// USB-C / USB Power Delivery port (UCPD1 + ST USBPD stack; power through the
// BQ25792: VAC1 = USB-C input, OTG = USB-C source). See docs/usb_pd.md.
// =============================================================================
enum UsbPdState {
    USB_PD_STATE_DETACHED = 0;
    USB_PD_STATE_ATTACHED = 1;       // Type-C attached, no explicit contract (yet)
    USB_PD_STATE_CONTRACT = 2;       // explicit PD contract
    USB_PD_STATE_HARD_RESET = 3;     // hard reset / error recovery in progress
}

enum UsbPdPowerRole {
    USB_PD_POWER_ROLE_NONE = 0;
    USB_PD_POWER_ROLE_SINK = 1;
    USB_PD_POWER_ROLE_SOURCE = 2;
}

enum UsbPdDataRole {
    USB_PD_DATA_ROLE_NONE = 0;
    USB_PD_DATA_ROLE_UFP = 1;
    USB_PD_DATA_ROLE_DFP = 2;
}

// Type-C current advertised by the partner's Rp (sink role, sampled at attach)
enum TypeCCurrent {
    TYPEC_CURRENT_NONE = 0;
    TYPEC_CURRENT_DEFAULT = 1;       // USB default (500 mA used)
    TYPEC_CURRENT_1A5 = 2;
    TYPEC_CURRENT_3A0 = 3;
}

enum UsbPdSourceState {
    USB_PD_SOURCE_DISABLED = 0;          // source role switched off (UsbPdConfig)
    USB_PD_SOURCE_READY = 1;             // a sink that attaches gets 5 V from the battery
    USB_PD_SOURCE_ACTIVE = 2;            // supplying VBUS (BQ25792 OTG)
    USB_PD_SOURCE_BLOCKED_DOCK = 3;      // dock DC present: OTG cannot run
    USB_PD_SOURCE_BLOCKED_BATTERY = 4;   // battery absent, low, or OTG fault
}

message UsbPdStatus {
    required UsbPdState state = 1;
    required UsbPdPowerRole power_role = 2;
    optional UsbPdDataRole data_role = 3;
    optional uint32 cc_line = 4;              // 1 = CC1, 2 = CC2 (UCPD numbering)
    optional TypeCCurrent typec_current = 5;
    optional float contract_voltage = 6;      // V
    optional float contract_current = 7;      // A, operating current of the contract
    repeated uint32 source_pdos = 8;          // raw PDOs of the partner's Source_Capabilities
    optional uint32 selected_pdo = 9;         // 1-based object position requested
    optional bool capability_mismatch = 10;
    required UsbPdSourceState source_state = 11;
    optional bool dead_battery_rd = 12;       // external 5.1 k Rd connected (PD0 low)
    optional uint32 spec_revision = 13;       // PD major revision (2 or 3)
    optional uint32 hard_resets = 14;         // since boot
    optional float input_current_limit = 15;  // A, limit for the USB-C input (contract / Rp)
    optional float vbus_voltage = 16;         // V, VBUS_USBC as the stack sees it (BQ25792 VAC1)
}

message UsbPdConfig {
    required bool source_enabled = 1;               // allow the SOURCE role
    required float max_sink_voltage = 2;            // V, highest fixed PDO requested (5 - 20)
    required float max_sink_current = 3;            // A, highest current requested (0.5 - 3)
    optional float source_min_battery_voltage = 4;  // V, battery needed to start sourcing
}

// Absent fields keep their value. A changed sink limit renegotiates the contract.
message UsbPdConfigRequest {
    optional bool source_enabled = 1;
    optional float max_sink_voltage = 2;
    optional float max_sink_current = 3;
    optional float source_min_battery_voltage = 4;
}

// Sink: re-read the partner's Source_Capabilities and request again (or hard reset).
message UsbPdRenegotiate {
    optional bool hard_reset = 1;
}

// =============================================================================
// Oscilloscope (long traces in PSRAM, see controller/inc/oscilloscope.hpp)
// =============================================================================
enum ScopeState {
    SCOPE_STATE_IDLE = 0;
    SCOPE_STATE_PRETRIGGER = 1;    // recording, waiting for a trigger
    SCOPE_STATE_POSTTRIGGER = 2;   // triggered, recording post-trigger samples
    SCOPE_STATE_STOPPING = 3;      // draining to PSRAM
    SCOPE_STATE_DONE = 4;          // capture complete, can be read
    SCOPE_STATE_ERROR = 5;         // see ScopeStatus.error
}

enum ScopeTriggerKind {
    SCOPE_TRIGGER_SOFTWARE = 0;
    SCOPE_TRIGGER_ANALOG_WATCHDOG = 1;
    SCOPE_TRIGGER_COMPARATOR = 2;
    SCOPE_TRIGGER_EXTERNAL = 3;
}

// Where bulk data (DATA frames) of a transfer is sent
enum DataLink {
    DATA_LINK_ORIGIN = 0;   // the link the request came from
    DATA_LINK_AUX = 1;      // aux UART (configure its baud with DataLinkConfigure)
}

message ScopeChannelConfig {
    required uint32 adc = 1;             // 1..5
    required uint32 input = 2;           // ADC input number (ADC_CHANNEL_<input>)
    optional uint32 sampling_time = 3;   // 0..7 = 2.5, 6.5, 12.5, 24.5, 47.5, 92.5, 247.5, 640.5 ADC cycles
}

message ScopeTriggerSettings {
    optional bool software = 1 [default = true];
    optional bool analog_watchdog = 2;
    optional uint32 awd_channel = 3;     // index into ScopeConfigure.channels
    optional uint32 awd_low = 4;
    optional uint32 awd_high = 5 [default = 4095];
    optional uint32 comparator = 6;      // COMP number 1..7; 0 = none
    optional bool external = 7;          // accept firmware/HRTIM triggers
    optional bool require_full_pretrigger = 8 [default = true];
}

message ScopeConfigure {
    repeated ScopeChannelConfig channels = 1;   // 1..4, channel index = order here
    required uint32 sample_rate_hz = 2;
    required uint32 pre_trigger_samples = 3;
    required uint32 post_trigger_samples = 4;
    optional ScopeTriggerSettings trigger = 5;
}

message ScopeArm {}
message ScopeForceTrigger {}
message ScopeStop {}
message ScopeGetStatus {}

message ScopeStatus {
    required ScopeState state = 1;
    optional ControllerErrorCode error = 2;      // when state = ERROR
    // Valid when state = DONE: samples [first_sample, post_trigger_samples) relative to the trigger
    optional uint32 num_channels = 3;
    optional uint32 sample_rate_hz = 4;           // actual rate
    optional ScopeTriggerKind trigger_source = 5;
    optional sint64 first_sample = 6;             // <= 0
    optional uint32 post_trigger_samples = 7;
}

// Read samples of a finished capture. Data arrives as DATA frames (scope_data.hpp) on
// the selected link, then a ScopeReadComplete EVENT on the origin link. Missing or
// corrupted frames are re-requested with another ScopeRead for that range.
message ScopeRead {
    required uint32 transfer_id = 1;    // chosen by the host, echoed in DATA frames (low 16 bits)
    required uint32 channel_mask = 2;   // bit n = channel n
    required sint64 start = 3;          // first sample relative to the trigger
    required uint32 count = 4;          // samples per channel
    optional DataLink link = 5;
}

message ScopeReadStarted {
    required uint32 transfer_id = 1;
    required uint32 frames = 2;              // DATA frames that will be sent
    required uint32 samples_per_frame = 3;
    required DataLink link = 4;
}

message ScopeReadCancel {
    required uint32 transfer_id = 1;
}

// EVENT sent on the origin link when a transfer ends
message ScopeReadComplete {
    required uint32 transfer_id = 1;
    required uint32 frames_sent = 2;
    required bool cancelled = 3;
    optional ControllerErrorCode error = 4;
}

// Aux UART data link
message DataLinkConfigure {
    required uint32 baudrate = 1;
}

message DataLinkStatus {
    required uint32 baudrate = 1;   // actual rate after quantisation
}

// =============================================================================
// Request Commands
// =============================================================================
message GetSystemStatus {}

// --- Device diagnostics -----------------------------------------------------

enum DeviceLogLevel {
    DEVICE_LOG_TRACE = 0;
    DEVICE_LOG_DEBUG = 1;
    DEVICE_LOG_INFO = 2;
    DEVICE_LOG_WARN = 3;
    DEVICE_LOG_ERROR = 4;
}

// Forward firmware log messages to the requesting link as LogMessage EVENTs.
message LogSubscribe {
    optional bool enabled = 1 [default = true];
    optional DeviceLogLevel min_level = 2 [default = DEVICE_LOG_INFO];
    optional bool replay = 3 [default = true];    // first send the recent history
}

message LogMessage {
    required uint32 tick_ms = 1;
    required DeviceLogLevel level = 2;
    required string text = 3;
    optional uint32 dropped = 4;    // messages lost (queue full) before this one
}

message GetDeviceInfo {}

message ThreadInfo {
    required string name = 1;
    required uint32 stack_free_bytes = 2;   // high-water mark: least free stack ever
    required uint32 priority = 3;           // FreeRTOS priority (osPriorityNormal = 24)
    required uint32 state = 4;              // FreeRTOS eTaskState: 0 running, 1 ready, 2 blocked, 3 suspended, 4 deleted
}

message DeviceInfo {
    required string board = 1;
    required string firmware = 2;           // git describe + build date
    required uint32 uptime_ms = 3;
    required uint32 heap_free = 4;          // FreeRTOS heap
    required uint32 heap_min_free = 5;
    required uint32 reset_flags = 6;        // RCC_CSR at boot: bit 31 LPWR, 30 WWDG, 29 IWDG, 28 SFT, 27 BOR, 26 PIN, 25 OBL
    optional bool psram_ok = 7;
    optional string psram_config = 8;
    repeated ThreadInfo threads = 9;
    optional uint32 log_dropped = 10;       // log messages lost since boot
}

// input_current_limit sets ChargerConfig.input_current_cap and input_voltage_limit sets
// ChargerConfig.input_voltage_floor (the policy owns IINDPM / VINDPM themselves).
// input_source: AUTO = dock first, USB-C otherwise (policy); AC1 / AC2 force one input.
message ChargerConfigRequest {
    optional float charge_voltage_limit = 1;
    optional float charge_current_limit = 2;
    optional float input_voltage_limit = 3;   // V, VINDPM floor 3.6 - 22
    optional float input_current_limit = 4;   // A, input current cap 0.1 - 3.3
    optional ChargerInputSource input_source = 5;
    optional bool enabled = 6;           // charging enable (CHG_CONFIG)
    optional float dock_input_current_limit = 7;   // A, 0.1 - 3.3 (default 3.0)
}

// Absent fields keep their current value.
message OutputRegulatorConfigRequest {
    optional float output_voltage = 1;
    optional float output_current_limit = 2;
    optional float sense_resistor_ohms = 3;
    optional bool enabled = 4;           // output enable, applied after the setpoints
}

message DACConfigRequest {
    optional DACMode mode = 1;
    optional float voltage = 2;
    optional WaveformType waveform_type = 3;
    optional float frequency = 4;
    optional float amplitude = 5;
}

// =============================================================================
// Request Commands
// =============================================================================
message Request {
  oneof command {
    Ping ping = 1;

    // System status
    GetSystemStatus get_system_status = 2;

    // Charger commands
    ChargerConfigRequest set_charger_config = 3;

    // Output Regulator (TPS55289) commands
    OutputRegulatorConfigRequest set_output_regulator_config = 4;

    // DAC commands
    DACConfigRequest set_dac_config = 5;

    // Applet lifecycle commands (handled by controller)
    AppletStart applet_start = 6;
    AppletStop applet_stop = 7;

    // Applet command (sent to applet's on_message)
    AppletCommand applet_command = 8;

    // Applet list command (triggers applet_list_response)
    AppletList applet_list = 9;

    // Oscilloscope
    ScopeConfigure scope_configure = 10;
    ScopeArm scope_arm = 11;
    ScopeForceTrigger scope_force_trigger = 12;
    ScopeStop scope_stop = 13;
    ScopeGetStatus scope_get_status = 14;
    ScopeRead scope_read = 15;
    ScopeReadCancel scope_read_cancel = 16;

    // Aux UART data link
    DataLinkConfigure data_link_configure = 17;

    LogSubscribe log_subscribe = 18;
    GetDeviceInfo get_device_info = 19;

    // USB-C / USB-PD port (answered with system_status + result)
    UsbPdConfigRequest set_usb_pd_config = 20;
    UsbPdRenegotiate usb_pd_renegotiate = 21;
  }
}

// =============================================================================
// Response Payloads
// =============================================================================
message Response {
  oneof payload {
    Pong pong = 1;

    // System status (all hardware in one message)
    SystemStatus system_status = 2;

    // Applet responses
    AppletStatus applet_status = 5;
    AppletListResponse applet_list_response = 6;

    // Oscilloscope
    ScopeStatus scope_status = 7;
    ScopeReadStarted scope_read_started = 8;
    ScopeReadComplete scope_read_complete = 9;   // sent as an EVENT frame

    DataLinkStatus data_link_status = 11;        // 10 is `result`
    LogMessage log_message = 12;                 // sent as an EVENT frame
    DeviceInfo device_info = 13;
  }

  // Result of the command (outside the oneof so it accompanies the payload)
  optional CommandResult result = 10;
}

// =============================================================================
// Applet Lifecycle Commands (handled by controller, not applet)
// =============================================================================
message AppletStart {
    required string applet_name = 1;
    repeated string args = 2;         // Arguments passed to configure()
}

message AppletStop {
    required string applet_name = 1;
}

// =============================================================================
// Applet Command (sent to applet's on_message for configuration)
// =============================================================================
message AppletCommand {
    required string applet_name = 1;
    repeated string args = 2;
}

// =============================================================================
// Applet Status Response (with enum status code)
// =============================================================================
message AppletStatus {
    required bool exists = 1;
    required bool running = 2;
    required ResponseStatusCode status_code = 3;  // Enum status code instead of text
    required string text = 4;                       // Text field for detailed info (optional but kept for compatibility)
}

// =============================================================================
// Applet List Response (with enum status code)
// =============================================================================
message AppletListResponse {
    repeated string applet_names = 1;
    required ResponseStatusCode status_code = 2;  // Enum status code
    required string text = 3;                       // Text field for detailed info
}

// =============================================================================
// Applet List (request message - empty, just triggers the response)
// =============================================================================
message AppletList {
}
